<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200" width="100" height="200">
  <defs>
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <!-- Windshield Reflection -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3b4c"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <!-- Side Mirrors -->
    <rect x="12" y="70" width="10" height="15" rx="3" fill="#cbd5e1" />
    <rect x="78" y="70" width="10" height="15" rx="3" fill="#cbd5e1" />

    <!-- Main Car Body (White) -->
    <path d="M 25 15 
             C 18 15, 18 30, 18 60 
             L 16 140 
             C 16 185, 20 190, 35 190 
             L 65 190 
             C 80 190, 84 185, 84 140 
             L 82 60 
             C 82 30, 82 15, 75 15 
             Z" 
          fill="url(#body)" stroke="#94a3b8" stroke-width="1"/>

    <!-- Front Bumper Curve -->
    <path d="M 25 15 Q 50 10 75 15" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Rear Bumper Curve -->
    <path d="M 35 190 Q 50 193 65 190" fill="none" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Windshield -->
    <path d="M 24 55 
             C 24 45, 28 42, 35 40 
             L 65 40 
             C 72 42, 76 45, 76 55 
             L 78 75 
             C 78 80, 75 82, 65 82 
             L 35 82 
             C 25 82, 22 80, 22 75 
             Z" 
          fill="url(#glass)"/>

    <!-- Rear Window -->
    <path d="M 26 135 
             C 26 145, 30 148, 40 150 
             L 60 150 
             C 70 148, 74 145, 74 135 
             L 72 120 
             C 72 115, 68 112, 60 112 
             L 40 112 
             C 32 112, 28 115, 28 120 
             Z" 
          fill="url(#glass)"/>

    <!-- Roof/Sunroof area -->
    <rect x="25" y="85" width="50" height="25" rx="5" fill="#f8fafc" />
    <rect x="35" y="88" width="30" height="15" rx="3" fill="#0f172a" />
    
    <!-- Headlights -->
    <rect x="22" y="16" width="12" height="6" rx="2" fill="#fef08a" opacity="0.8"/>
    <rect x="66" y="16" width="12" height="6" rx="2" fill="#fef08a" opacity="0.8"/>

    <!-- Taillights -->
    <rect x="24" y="185" width="14" height="4" rx="1" fill="#ef4444"/>
    <rect x="62" y="185" width="14" height="4" rx="1" fill="#ef4444"/>
  </g>
</svg>
